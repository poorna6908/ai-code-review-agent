<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>ai code review agent</title>

    <!-- NEW: libraries to render markdown, sanitize it, and highlight code -->
    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

    <style>
        body{
            margin: 0;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            padding: 10px 20px;
            background: black;
            color: white;
            border:2px solid rgba(255, 255,255, 0.08);
        }
        .logogroup{
            display: flex;
            align-items: center;
            gap:10px;
        }
        .logo{
            font-size: 28px;
            color:#3b82f6;
        }
        .logotext{
            font-size:24px;
            font-weight: 700;
            color: white;
        }

        /* Main */
        .total {
            padding: 20px;
        }

        .bb {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .select {
            padding: 8px 12px;
            background: #1a1a1a;
            color: white;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 6px;
            cursor: pointer;
        }

        .review {
            padding: 8px 18px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
        }

        .review:hover {
            background: #2563eb;
        }

        .review:disabled {
            background: #1e3a6e;
            cursor: not-allowed;
        }

        .both {
            display: flex;
            gap: 16px;
            width: 100%;
        }

        .panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 6px;
            min-width: 0;
        }

        .input-label, .output-label {
            color: rgba(255,255,255,0.7);
            font-size: 14px;
        }

        .ta-input {
            height: 400px;
            width: 100%;
            box-sizing: border-box;
            background: #111;
            color: white;
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 8px;
            padding: 12px;
            font-size: 14px;
            font-family: 'Courier New', monospace;
            resize: vertical;
        }

        .ta-input:focus {
            outline: 1px solid #3b82f6;
        }

        /* CHANGED: output is now a div (not a textarea) so it can show formatted markdown */
        .ta-output {
            height: 400px;
            width: 100%;
            box-sizing: border-box;
            background: #111;
            color: #e5e7eb;
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 8px;
            padding: 16px;
            font-size: 14px;
            line-height: 1.6;
            overflow-y: auto;
            resize: vertical;
        }

        .ta-output .placeholder {
            color: rgba(255,255,255,0.4);
        }

        .ta-output h1,
        .ta-output h2,
        .ta-output h3 {
            color: #7cacff;
            margin: 1.2em 0 0.5em;
            line-height: 1.3;
        }

        .ta-output h1:first-child,
        .ta-output h2:first-child,
        .ta-output h3:first-child {
            margin-top: 0;
        }

        .ta-output h2 { font-size: 18px; }
        .ta-output h3 { font-size: 16px; }

        .ta-output p { margin: 0.6em 0; }

        .ta-output ul,
        .ta-output ol {
            padding-left: 22px;
            margin: 0.6em 0;
        }

        .ta-output table {
            border-collapse: collapse;
            width: 100%;
            display: block;
            overflow-x: auto;
            margin: 0.8em 0;
        }

        .ta-output th,
        .ta-output td {
            border: 1px solid rgba(255,255,255,0.15);
            padding: 8px 12px;
            text-align: left;
            vertical-align: top;
        }

        .ta-output th {
            background: #1c1c28;
            color: white;
        }

        .ta-output pre {
            background: #0d1117;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            padding: 14px;
            overflow-x: auto;
            margin: 0.8em 0;
        }

        .ta-output code {
            font-family: 'Fira Code', 'Courier New', monospace;
            font-size: 13px;
        }

        /* inline code (not inside a code block) */
        .ta-output :not(pre) > code {
            background: rgba(255,255,255,0.1);
            padding: 2px 6px;
            border-radius: 4px;
        }

        .ta-output pre code.hljs {
            background: transparent;
            padding: 0;
        }

        .ta-output hr {
            border: none;
            border-top: 1px solid rgba(255,255,255,0.12);
            margin: 1.2em 0;
        }

        /* Footer */
        footer {
            background-color: black;
            margin-top: 0px;
            border: 1px solid rgba(255,255,255,0.1);
            padding: 24px 20px;
            text-align: center;
            color: rgba(255,255,255,0.5);
            font-size: 14px;
        }

        .footer-contact span {
            color: #3b82f6;
        }

        /* Hero Section */
        .hero {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 20px 40px 20px;
            text-align: center;
            background: black;
        }

        .hero-badge {
            display: inline-flex;
            align-items: center;
            padding: 6px 16px;
            border: 1px solid rgba(0, 64, 212, 0.3);
            border-radius: 100px;
            color: rgba(0, 95, 212, 0.9);
            font-size: 13px;
            letter-spacing: 0.5px;
            margin-bottom: 24px;
            background: rgba(0, 212, 170, 0.05);
        }

        .hero h1 {
            font-size: 52px;
            font-weight: 800;
            color: white;
            line-height: 1.2;
            margin: 0 0 20px 0;
        }

        .hero h1 span {
            color: #3b82f6;
        }

        .hero p {
            font-size: 18px;
            color: rgba(255, 255, 255, 0.6);
            max-width: 560px;
            line-height: 1.6;
            margin: 0;
        }

        main {
            background-color: black;
            color: white;
        }

        .total {
            background-color: black;
        }

        .bb {
            background-color: black;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .hero {
                padding: 40px 16px 30px 16px;
            }

            .hero h1 {
                font-size: 32px;
            }

            .hero p {
                font-size: 15px;
            }

            /* NEW: stack input and output on small screens */
            .both {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <!-- header -->
    <header>
        <div class="logogroup">
            <div class="logo">⬡</div>
            <span class="logotext">codeAI</span>
        </div>
    </header>

    <section class="hero">
        <div class="hero-badge">AI-Powered · Real-time Review</div>
        <h1>Review. Refine.<br><span>Ship better code.</span></h1>
        <p>Paste your code, get instant AI feedback on bugs, style, and performance.</p>
    </section>

    <!-- main content -->
    <main>
        <div class="total">
            <div class="bb">
                <div>
                    <select class="select">
                        <option value="javascript">JavaScript</option>
                        <option value="python">Python</option>
                        <option value="typescript">TypeScript</option>
                        <option value="java">Java</option>
                        <option value="cpp">C++</option>
                        <option value="go">Go</option>
                        <option value="rust">Rust</option>
                        <option value="html">HTML/CSS</option>
                        <option value="sql">SQL</option>
                        <option value="other">Other</option>
                    </select>
                </div>
                <button class="review">Review my code</button>
            </div>

            <div class="both">
                <!-- input panel -->
                <div class="panel">
                    <label class="input-label">Enter your code</label>
                    <textarea class="ta-input" spellcheck="false"></textarea>
                </div>

                <!-- output panel (CHANGED: div instead of textarea) -->
                <div class="panel">
                    <label class="output-label">Output</label>
                    <div class="ta-output">
                        <span class="placeholder">Your code review will appear here.</span>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- footer -->
    <footer>
        <p>⬡ codeAI</p>
        <p>AI-powered code reviews for modern developers</p>
        <p><span class="footer-contact"><span>Contact:</span></span> purnachandrika007@gmail.com</p>
    </footer>

    <script>
        const inputBox = document.querySelector(".ta-input");
        const outputBox = document.querySelector(".ta-output");
        const reviewBtn = document.querySelector(".review");
        const languageSelect = document.querySelector(".select");

        // Show plain status text (loading / errors)
        function showMessage(text) {
            outputBox.textContent = text;
        }

        // Show the AI review as formatted markdown
        function showReview(markdownText) {
            const rawHtml = marked.parse(markdownText);
            outputBox.innerHTML = DOMPurify.sanitize(rawHtml);
            outputBox.querySelectorAll("pre code").forEach(function (block) {
                hljs.highlightElement(block);
            });
            outputBox.scrollTop = 0;
        }

        async function reviewCode() {
            const code = inputBox.value;

            if (!code.trim()) {
                showMessage("⚠️ Please enter some code first.");
                return;
            }

            showMessage("⏳ Reviewing your code...");
            reviewBtn.disabled = true;

            try {
                const response = await fetch("http://127.0.0.1:8000/review", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        code: code,
                        language: languageSelect.value
                    })
                });

                const data = await response.json();

                if (data.review) {
                    showReview(data.review);
                } else {
                    showMessage(data.error || "Something went wrong.");
                }
            } catch (error) {
                showMessage("❌ Error connecting to server");
            } finally {
                reviewBtn.disabled = false;
            }
        }

        // connect button click
        reviewBtn.addEventListener("click", reviewCode);
    </script>
</body>
</html>
